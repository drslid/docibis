          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/bundles:
    get:
      operationId: listBundles
      tags: [console]
      summary: Liasses de documents
      responses:
        "200":
          description: Les liasses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bundle"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createBundle
      tags: [console]
      summary: Crée une liasse (éditeurs)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BundleInput"
      responses:
        "201":
          description: Créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bundle"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/bundles/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
    put:
      operationId: updateBundle
      tags: [console]
      summary: Modifie une liasse (éditeurs)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BundleInput"
      responses:
        "200":
          description: Enregistrée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bundle"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteBundle
      tags: [console]
      summary: Supprime une liasse (éditeurs)
      responses:
        "204":
          description: Supprimée
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/bundles/{id}/try:
    post:
      operationId: tryBundle
      tags: [console]
      summary: Produit une liasse avec des données d'essai (éditeurs)
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BundleRenderRequest"
      responses:
        "200":
          description: La liasse
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Busy"
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: Clé API créée dans la console (page Clés API), envoyée dans l'en-tête Authorization
  responses:
    SignedIn:
      description: Connecté ; le cookie de session est posé
      headers:
        Set-Cookie:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Session"
    BadRequest:
      description: Demande refusée
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Connexion nécessaire, ou identifiants refusés
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Rôle insuffisant
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Introuvable
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Trop d'appels pour cette clé ; réessayer après Retry-After secondes
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyAttempts:
      description: Trop d'essais ; réessayer plus tard
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooLarge:
      description: Fichier ou données trop gros (limites de la configuration)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Gone:
      description: Demande expirée ; recommencer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Pas encore possible ; réessayer plus tard
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Busy:
      description: Moteur de rendu pas encore prêt, ou tous les workers occupés ; réessayer plus tard
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Session:
      type: object
      required: [authenticated, setupRequired, instance]
      properties:
        authenticated:
          type: boolean
        setupRequired:
          description: Aucun compte n'existe encore
          type: boolean
        instance:
          type: string
        user:
          $ref: "#/components/schemas/User"
    User:
      type: object
      required: [id, username, firstName, lastName, displayName, email, role, active, language, createdAt]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        displayName:
          description: Prénom et nom, ou l'identifiant s'ils manquent
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        active:
          type: boolean
        language:
          $ref: "#/components/schemas/Language"
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
        mfaEnabled:
          type: boolean
        mfaRequired:
          description: Le rôle impose la double authentification
          type: boolean
        avatarIcon:
          type: string
        avatarColor:
          type: string
    Role:
      description: admin = tout ; editor = essais et documents ; viewer = consultation
      type: string
      enum: [admin, editor, viewer]
    Language:
      type: string
      enum: [fr, en, de, it]
    UserCreate:
      type: object
      required: [username, firstName, lastName, role, password]
      properties:
        username:
          type: string
          maxLength: 100
        firstName:
          type: string
          maxLength: 60
        lastName:
          type: string
          maxLength: 60
        email:
          type: string
          maxLength: 200
        role:
          $ref: "#/components/schemas/Role"
        password:
          description: Mot de passe provisoire, à changer par la personne
          type: string
          maxLength: 72
    UserUpdate:
      type: object
      properties:
        firstName:
          type: string
          maxLength: 60
        lastName:
          type: string
          maxLength: 60
        email:
          type: string
          maxLength: 200
        role:
          $ref: "#/components/schemas/Role"
        active:
          type: boolean
        password:
          description: Nouveau mot de passe provisoire ; ferme les sessions du compte
          type: string
          maxLength: 72
    ProfileUpdate:
      type: object
      properties:
        firstName:
          type: string
          maxLength: 60
        lastName:
          type: string
          maxLength: 60
        language:
          $ref: "#/components/schemas/Language"
    Branding:
      type: object
      required: [companyLogo]
      properties:
        companyLogo:
          description: "none : aucun ; custom : logo envoyé par un administrateur"
          type: string
          enum: [none, custom]
        version:
          description: Version du logo personnalisé, à mettre dans son adresse
          type: string
    BrandingUpdate:
      type: object
      required: [companyLogo]
      properties:
        companyLogo:
          type: string
          enum: [none, custom]
        image:
          description: Logo en data URL (PNG, JPEG, WebP ou SVG sans script, 512 Ko au plus) ; requis pour passer à custom
          type: string
          maxLength: 720000
    RenderEntry:
      type: object
      required: [id, createdAt, source, actor, template, format, status, size, durationMs, engine]
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        source:
          type: string
          enum: [console, api, mcp]
        actor:
          description: Compte (console) ou nom de la clé (API, MCP)
          type: string
        template:
          type: string
        format:
          type: string
        status:
          description: "ok : produit ; refused : modèle ou données refusés ; error : panne du service"
          type: string
          enum: [ok, refused, error]
        error:
          type: string
        size:
          type: integer
          format: int64
        durationMs:
          type: integer
        engine:
          type: string
        hasData:
          description: Les données et le modèle sont gardés ; le document peut être produit à nouveau
          type: boolean
        requestId:
          description: Identifiant de la demande, aussi présent dans les journaux
          type: string
        templateVersion:
          type: integer
        options:
          description: Options appliquées (PDF/A, filigrane…)
          type: string
    RenderPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RenderEntry"
        total:
          type: integer
    AuditEntry:
      type: object
      required: [id, createdAt, actor, action, target, details, ip]
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        actor:
          type: string
        action:
          type: string
        target:
          type: string
        details:
          type: string
        ip:
          type: string
    AuditPage:
      type: object
      required: [items, total, actions]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        total:
          type: integer
        actions:
          description: Toutes les actions déjà journalisées, pour le filtre
          type: array
          items:
            type: string
    Monitoring:
      type: object
      required: [at, health, version, instance, uptimeSeconds, database, workers, memory, traffic, renders]
      properties:
        system:
          $ref: "#/components/schemas/SystemUsage"
        at:
          type: string
          format: date-time
        health:
          type: string
          enum: [ok, degraded, down]
        problems:
          type: array
          items:
            type: string
        version:
          type: string
        instance:
          type: string
        uptimeSeconds:
          type: integer
          format: int64
        database:
          type: object
          required: [engine, ok, replication]
          properties:
            engine:
              type: string
            ok:
              type: boolean
            replication:
              $ref: "#/components/schemas/Replication"
        workers:
          type: object
          required: [ready, total, busy, queued]
          properties:
            ready:
              type: boolean
            total:
              type: integer
            busy:
              type: integer
            queued:
              type: integer
        memory:
          type: object
          required: [heapMb, systemMb, goroutines]
          properties:
            heapMb:
              type: number
            systemMb:
              type: number
            goroutines:
              type: integer
        traffic:
          type: object
          required: [requestsPerMinute, errorsPerMinute, series]
          properties:
            requestsPerMinute:
              type: integer
            errorsPerMinute:
              type: integer
            series:
              type: array
              items:
                $ref: "#/components/schemas/TrafficPoint"
        renders:
          type: object
          required: [lastHour, errorsLastHour, refusedLastHour, p50Ms, p95Ms, last24h, series]
          properties:
            lastHour:
              description: Documents produits dans l'heure
              type: integer
            errorsLastHour:
              description: Pannes du service dans l'heure
              type: integer
            refusedLastHour:
              description: Demandes refusées (modèle ou données) dans l'heure
              type: integer
            p50Ms:
              type: integer
            p95Ms:
              type: integer
            last24h:
              description: Documents produits en 24 heures
              type: integer
            series:
              type: array
              items:
                $ref: "#/components/schemas/RenderPoint"
    Dashboard:
      description: Documents des 30 derniers jours, refus et pannes à part
      type: object
      required: [today, last7d, last30d, successRate, refused30d, errors30d, p50Ms, p95Ms, activeKeys, users, days, sources, topTemplates, topActors, recent]
      properties:
        today:
          type: integer
        last7d:
          type: integer
        last30d:
          type: integer
        successRate:
          description: Documents produits sur documents demandés (refus compris), en %
          type: number
        refused30d:
          type: integer
        errors30d:
          type: integer
        p50Ms:
          type: integer
        p95Ms:
          type: integer
        activeKeys:
          type: integer
        users:
          type: integer
        days:
          type: array
          items:
            $ref: "#/components/schemas/DayPoint"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/NameCount"
        topTemplates:
          type: array
          items:
            $ref: "#/components/schemas/NameCount"
        topActors:
          type: array
          items:
            $ref: "#/components/schemas/NameCount"
        recent:
          type: array
          items:
            $ref: "#/components/schemas/RenderEntry"
    DayPoint:
      type: object
      required: [date, ok, refused, errors]
      properties:
        date:
          description: Jour (AAAA-MM-JJ, UTC)
          type: string
        ok:
          type: integer
        refused:
          type: integer
        errors:
          type: integer
    NameCount:
      type: object
      required: [name, count]
      properties:
        name:
          type: string
        count:
          type: integer
    McpInfo:
      type: object
      required: [available, serverName, url, transport, authHeader, version]
      properties:
        available:
          type: boolean
        serverName:
          type: string
        url:
          type: string
        transport:
          type: string
        authHeader:
          type: string
        version:
          type: string
    MetricsToken:
      type: object
      required: [configured, fromEnv]
      properties:
        configured:
          type: boolean
        fromEnv:
          description: Fixé par la variable METRICS_TOKEN
          type: boolean
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        token:
          description: Le jeton, renvoyé une seule fois à sa création
          type: string
    TrafficPoint:
      type: object
      required: [t, requests, errors]
      properties:
        t:
          type: string
          format: date-time
        requests:
          type: integer
        errors:
          type: integer
    RenderPoint:
      description: Une minute ; count compte les documents produits et les pannes, pas les refus
      type: object
      required: [t, count, errors, p95Ms]
      properties:
        t:
          type: string
          format: date-time
        count:
          type: integer
        errors:
          type: integer
        p95Ms:
          type: integer
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 100
        password:
          type: string
          maxLength: 72
    SetupRequest:
      type: object
      required: [setupCode, username, password]
      properties:
        setupCode:
          type: string
          maxLength: 20
        username:
          type: string
          maxLength: 100
        password:
          type: string
          maxLength: 72
    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 72
        newPassword:
          type: string
          maxLength: 72
    SettingsPage:
      type: object
      required: [groups, startup]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/SettingsGroup"
        startup:
          description: Réglages de démarrage, en lecture seule
          type: array
          items:
            $ref: "#/components/schemas/StartupSetting"
    SettingsGroup:
      type: object
      required: [id, label, settings]
      properties:
        id:
          type: string
        label:
          type: string
        settings:
          type: array
          items:
            $ref: "#/components/schemas/Setting"
    Setting:
      type: object
      required: [key, label, kind, value, default, source, locked, active, restart]
      properties:
        key:
          type: string
        label:
          type: string
        help:
          type: string
        kind:
          type: string
          enum: [text, number, toggle, choice, list]
        value:
          type: string
        default:
          type: string
        options:
          type: array
          items:
            type: string
        min:
          type: integer
        max:
          type: integer
        source:
          type: string
          enum: [default, console, environment]
        env:
          description: Variable d'environnement qui peut fixer ce réglage
          type: string
        locked:
          description: Fixé par sa variable d'environnement
          type: boolean
        active:
          description: Faux tant que la fonction qui l'utilise n'existe pas
          type: boolean
        restart:
          description: Prend effet au redémarrage
          type: boolean
    StartupSetting:
      type: object
      required: [key, label, value, source]
      properties:
        key:
          type: string
        label:
          type: string
        help:
          type: string
        value:
          type: string
        source:
          type: string
          enum: [default, file, environment]
    SettingsUpdate:
      type: object
      required: [values]
      properties:
        values:
          type: object
          additionalProperties:
            type: string
    TryAnalyzeForm:
      type: object
      required: [template]
      properties:
        template:
          description: Modèle Word (.docx) ou OpenDocument (.odt)
          type: string
          format: binary
    RenderForm:
      type: object
      required: [data]
      properties:
        template:
          description: Modèle Word (.docx) ou OpenDocument (.odt), avec ses balises Docmosis ; ou bien templateName
          type: string
          format: binary
        templateName:
          description: Chemin d'un modèle de la bibliothèque (version publiée)
          type: string
        data:
          description: Données JSON du document (texte ou fichier)
          type: string
        format:
          description: Format du document produit ; xlsx et ods pour un modèle Excel, pptx et odp pour un modèle PowerPoint
          type: string
          enum: [pdf, docx, doc, odt, rtf, html, txt, xlsx, ods, pptx, odp]
          default: pdf
        outputName:
          description: Nom du fichier rendu (Content-Disposition)
          type: string
        pdfa:
          description: Norme d'archivage ; défaut du réglage « PDF/A par défaut »
          type: string
          enum: [none, PDF/A-1b, PDF/A-2b, PDF/A-3b]
        accessible:
          description: PDF balisé et conforme PDF/UA-1, lisible par les lecteurs d'écran ; sans titre (title) ni titre dans le modèle, le nom du document sert de titre. Avec PDF/A, choisir PDF/A-2b ou 3b (PDF/A-1b reste balisé mais sans la marque PDF/UA)
          type: boolean
        watermark:
          description: Texte du filigrane ; « none » pour aucun ; défaut du réglage « Filigrane »
          type: string
          maxLength: 100
        watermarkColor:
          description: Couleur du filigrane, #RRGGBB
          type: string
        watermarkSize:
          description: Taille du texte en points (0 = automatique)
          type: integer
        watermarkAngle:
          description: Angle en degrés
          type: integer
        watermarkTiled:
          description: Répéter le filigrane sur toute la page
          type: boolean
        dataCheck:
          description: Contrôle des données attendues par le modèle ; défaut celui du modèle de la bibliothèque, sinon warn
          type: string
          enum: [off, warn, strict]
        passwordProtect:
          description: Mot de passe demandé à l'ouverture du PDF (pas avec PDF/A) ; jamais gardé dans l'historique
          type: string
          maxLength: 128
        pdfRestrictPassword:
          description: Mot de passe du propriétaire, qui active les restrictions pdfRestrict…
          type: string
          maxLength: 128
        pdfRestrictPrinting:
          description: 0 pas d'impression, 1 basse résolution, 2 pleine qualité (défaut)
          type: integer
          enum: [0, 1, 2]
        pdfRestrictEditing:
          description: 0 aucune modification … 4 tout sauf l'extraction de pages (défaut)
          type: integer
          enum: [0, 1, 2, 3, 4]
        pdfRestrictCopy:
          description: Interdire la copie du contenu
          type: boolean
        pdfRestrictAllowAccessibilty:
          description: Interdire aussi l'accès des outils d'accessibilité (nom Docmosis)
          type: boolean
        pdfSkipEmptyPages:
          description: Retirer les pages blanches ajoutées pour commencer sur une page paire ou impaire
          type: boolean
        title:
          description: Titre du document (métadonnées du PDF)
          type: string
          maxLength: 500
        author:
          description: Auteur (métadonnées du PDF)
          type: string
          maxLength: 500
        subject:
          description: Sujet (métadonnées du PDF)
          type: string
          maxLength: 500
        keywords:
          description: Mots-clés, séparés par des virgules (métadonnées du PDF)
          type: string
          maxLength: 500
        devMode:
          description: Mode développeur (nom Docmosis) ; les données absentes et les expressions illisibles sont écrites en surbrillance dans le document
          type: boolean
        seal:
          description: Cachet électronique de l'organisation (signature PAdES qui certifie le PDF) ; serveur configuré avec SEAL_CERT et SEAL_KEY ; incompatible avec un mot de passe
          type: boolean
    RenderAsyncForm:
      allOf:
        - $ref: "#/components/schemas/RenderForm"
        - type: object
          properties:
            callbackUrl:
              description: Adresse HTTPS qui reçoit un POST JSON (RenderJob) quand le document est prêt ou en échec ; domaine autorisé dans la configuration
              type: string
              maxLength: 4000
            uploadUrl:
              description: Adresse HTTPS où DocIbis dépose le document par PUT (adresse S3 présignée, par exemple) ; domaine autorisé dans la configuration
              type: string
              maxLength: 4000
    RenderJob:
      description: Un document produit en arrière-plan
      type: object
      required: [id, status, createdAt, expiresAt, template, format]
      properties:
        id:
          type: string
          example: job_k7qm2xv9ab3d4e5f
        status:
          description: queued (en attente), running (en cours), done (prêt), failed (en échec)
          type: string
          enum: [queued, running, done, failed]
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        expiresAt:
          description: Après cette date, le travail et son document sont effacés
          type: string
          format: date-time
        template:
          type: string
        format:
          type: string
          enum: [pdf, docx, doc, odt, rtf, html, txt, xlsx, ods, pptx, odp]
        size:
          description: Taille du document, en octets
          type: integer
          format: int64
        error:
          type: string
        documentUrl:
          description: Adresse du document (GET, même clé), quand il est prêt
          type: string
        upload:
          description: Dépôt vers uploadUrl
          type: string
          enum: [pending, done, failed]
        callback:
          description: Rappel vers callbackUrl
          type: string
          enum: [pending, done, failed]
    RenderOptions:
      type: object
      properties:
        format:
          type: string
          enum: [pdf, docx, doc, odt, rtf, html, txt, xlsx, ods, pptx, odp]
        pdfa:
          type: string
          enum: [none, PDF/A-1b, PDF/A-2b, PDF/A-3b]
        accessible:
