openapi: 3.1.0
info:
  title: DocIbis API
  version: 0.1.0
  description: |
    Génération de documents PDF et Word à partir de modèles Word.
    `/v1` sert les applications (clé API), `/api` la console (session),
    `/healthz` et `/readyz` la supervision.
servers:
  - url: /
tags:
  - name: documents
    description: Production de documents par les applications (clé API)
  - name: supervision
    description: État du service
  - name: console
    description: API de la console
paths:
  /v1/render:
    post:
      operationId: renderDocument
      tags: [documents]
      summary: Produit un document à partir d'un modèle Word et de données JSON
      description: |
        Envoyez le modèle Word (.docx, avec ses balises Docmosis), ou le nom d'un modèle de la
        bibliothèque (templateName), et les données JSON ; la réponse est le document (PDF par
        défaut). Ni le document ni ses données ne sont gardés.

            curl -H "Authorization: Bearer $DOCIBIS_API_KEY" \
              -F templateName=acme/contracts/broker/monthly/fiche_conseil.docx \
              -F data=@donnees.json -o document.pdf https://<instance>/v1/render
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/RenderForm"
      responses:
        "200":
          description: Le document produit
          headers:
            Content-Disposition:
              schema:
                type: string
            X-Render-Ms:
              description: Temps de production, en millisecondes
              schema:
                type: integer
            X-Render-Engine:
              description: Moteur utilisé
              schema:
                type: string
            X-Missing-Fields:
              description: Données attendues par le modèle mais absentes (contrôle « warn »), chemins séparés par des virgules et encodés comme dans une URL
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            application/msword:
              schema:
                type: string
                format: binary
            application/vnd.oasis.opendocument.text:
              schema:
                type: string
                format: binary
            application/rtf:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/vnd.oasis.opendocument.spreadsheet:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema:
                type: string
                format: binary
            application/vnd.oasis.opendocument.presentation:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/TooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Busy"
  /v1/render/async:
    post:
      operationId: renderDocumentAsync
      tags: [documents]
      summary: Produit un document en arrière-plan
      description: |
        Mêmes champs que /v1/render ; la réponse arrive tout de suite (202) avec le numéro du
        travail. Le document se lit ensuite par GET /v1/jobs/{id}/document, pendant le délai du
        réglage « Conservation des documents ». callbackUrl reçoit un POST JSON à la fin
        (signé par X-DocIbis-Signature) ; uploadUrl reçoit le document par PUT (adresse S3
        présignée, par exemple). Ces deux adresses visent un domaine autorisé dans la
        configuration, en HTTPS.

            curl -H "Authorization: Bearer $DOCIBIS_API_KEY" \
              -F templateName=acme/contracts/broker/monthly/fiche_conseil.docx \
              -F data=@donnees.json -F callbackUrl=https://app.exemple.fr/docibis \
              https://<instance>/v1/render/async
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/RenderAsyncForm"
      responses:
        "202":
          description: Demande acceptée, en attente
          headers:
            Location:
              description: Adresse de l'état du travail
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/TooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Busy"
  /v1/jobs/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getRenderJob
      tags: [documents]
      summary: État d'un document produit en arrière-plan
      security:
        - apiKey: []
      responses:
        "200":
          description: L'état du travail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/jobs/{id}/document:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getRenderJobDocument
      tags: [documents]
      summary: Document produit en arrière-plan
      description: Répond 409 tant que le document n'est pas prêt, 404 une fois le délai de conservation passé.
      security:
        - apiKey: []
      responses:
        "200":
          description: Le document produit
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            application/msword:
              schema:
                type: string
                format: binary
            application/vnd.oasis.opendocument.text:
              schema:
                type: string
                format: binary
            application/rtf:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/vnd.oasis.opendocument.spreadsheet:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema:
                type: string
                format: binary
            application/vnd.oasis.opendocument.presentation:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/render/batch:
    post:
      operationId: renderBatch
      tags: [documents]
      summary: Produit plusieurs documents en un appel, fusionnés en un seul PDF ou rendus dans un zip
      description: |
        Chaque document vient d'un modèle de la bibliothèque et de ses données, ou d'un PDF fixe de la
        bibliothèque (conditions générales…). Les documents sont produits en parallèle puis, avec
        merge (par défaut), réunis dans l'ordre en un seul PDF.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchRequest"
      responses:
        "200":
          description: Le PDF fusionné, ou un zip des documents
          headers:
            Content-Disposition:
              schema:
                type: string
            X-Render-Ms:
              schema:
                type: integer
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/TooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Busy"
  /v1/bundles/{name}/render:
    post:
      operationId: renderBundle
      tags: [documents]
      summary: Produit une liasse définie dans la console (plusieurs modèles et PDF fixes) avec les mêmes données
      description: |
        La liasse (page Liasses de la console) dit quels documents produire, dans quel ordre et
        sous quelles conditions ; l'application n'envoie que son nom et les données.
      security:
        - apiKey: []
      parameters:
        - {name: name, in: path, required: true, description: "Nom de la liasse, par exemple souscription-habitation", schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BundleRenderRequest"
      responses:
        "200":
          description: Le PDF de la liasse, ou un zip de ses documents
          headers:
            Content-Disposition:
              schema:
                type: string
            X-Render-Ms:
              schema:
                type: integer
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Busy"
  /v1/templates/import:
    post:
      operationId: receiveTemplates
      tags: [templates]
      summary: Reçoit des modèles d'un autre environnement (promotion), avec une clé qui le permet
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                publish:
                  type: boolean
      responses:
        "200":
          description: Ce qui a été reçu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/TooLarge"
  /v1/templates:
    get:
      operationId: listPublishedTemplates
      tags: [documents]
      summary: Modèles publiés de la bibliothèque, avec les données qu'ils attendent
      security:
        - apiKey: []
      parameters:
        - {name: q, in: query, description: Texte cherché dans le chemin, schema: {type: string}}
      responses:
        "200":
          description: Les modèles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemplateContract"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/render:
    post:
      operationId: docmosisRender
      tags: [documents]
      summary: Compatibilité Docmosis (Tornado) — même appel que document-composition
      description: |
        Les applications qui appelaient Docmosis passent à DocIbis en changeant seulement l'adresse
        et accessKey (une clé API DocIbis). templateName est le chemin du modèle dans la bibliothèque.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocmosisRender"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/DocmosisRenderForm"
      responses:
        "200":
          description: Le document produit
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            application/msword:
              schema:
                type: string
                format: binary
            application/vnd.oasis.opendocument.text:
              schema:
                type: string
                format: binary
            application/rtf:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/vnd.oasis.opendocument.spreadsheet:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema:
                type: string
                format: binary
            application/vnd.oasis.opendocument.presentation:
              schema:
                type: string
                format: binary
        "400":
          description: Demande refusée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocmosisError"
        "401":
          description: accessKey inconnue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocmosisError"
        "404":
          description: Modèle introuvable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocmosisError"
        "429":
          description: Trop d'appels pour cette clé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocmosisError"
        "503":
          description: Moteur occupé ou en démarrage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocmosisError"
  /v1/openapi.json:
    get:
      operationId: getContract
      tags: [documents]
      summary: Ce contrat, pour générer un client dans n'importe quel langage
      security: []
      responses:
        "200":
          description: Contrat OpenAPI 3.1
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /healthz:
    get:
      operationId: getHealthz
      tags: [supervision]
      summary: Le processus répond
      security: []
      responses:
        "200":
          description: Vivant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadyz
      tags: [supervision]
      summary: Prêt à servir (base ouverte et à jour)
      security: []
      responses:
        "200":
          description: Prêt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Pas encore prêt, ou plus en état de servir
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/info:
    get:
      operationId: getInfo
      tags: [console]
      summary: Version, environnement et base de l'instance
      responses:
        "200":
          description: Informations de l'instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Le service démarre
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/auth/session:
    get:
      operationId: getSession
      tags: [console]
      summary: Session en cours, et s'il faut créer le premier administrateur
      security: []
      responses:
        "200":
          description: État de la session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /api/auth/setup:
    post:
      operationId: setup
      tags: [console]
      summary: Crée le premier administrateur avec le code affiché dans les journaux
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: L'administrateur existe déjà
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /api/auth/login:
    post:
      operationId: login
      tags: [console]
      summary: Connexion à la console
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/SignedIn"
        "202":
          description: Mot de passe accepté ; la double authentification suit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaStep"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /api/auth/logout:
    post:
      operationId: logout
      tags: [console]
      summary: Déconnexion
      security: []
      responses:
        "204":
          description: Déconnecté
          headers:
            Set-Cookie:
              schema:
                type: string
  /api/auth/password:
    post:
      operationId: changePassword
      tags: [console]
      summary: Change le mot de passe du compte connecté
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Mot de passe changé
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/settings:
    get:
      operationId: getSettings
      tags: [console]
      summary: Tous les réglages, avec leur valeur et leur origine
      responses:
        "200":
          description: Réglages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateSettings
      tags: [console]
      summary: Enregistre des réglages ; une valeur vide revient au défaut
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Réglages enregistrés
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/try/analyze:
    post:
      operationId: tryAnalyze
      tags: [console]
      summary: Lit un modèle Word ; moteur possible et données d'exemple tirées de ses balises
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/TryAnalyzeForm"
      responses:
        "200":
          description: Modèle lu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TryTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/TooLarge"
        "503":
          $ref: "#/components/responses/Busy"
  /api/try/render:
    post:
      operationId: tryRender
      tags: [console]
      summary: Produit le PDF d'un modèle avec des données JSON ; rien n'est enregistré
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/TryRenderForm"
      responses:
        "200":
          description: Document produit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TryResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/TooLarge"
        "503":
          $ref: "#/components/responses/Busy"
  /api/keys:
    get:
      operationId: listApiKeys
      tags: [console]
      summary: Clés API des applications
      responses:
        "200":
          description: Clés, les plus récentes d'abord
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createApiKey
      tags: [console]
      summary: Crée une clé ; son secret n'est affiché qu'une fois
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyCreate"
      responses:
        "201":
          description: Clé créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/keys/{id}:
    patch:
      operationId: updateApiKey
      tags: [console]
      summary: Change le nom ou la limite d'appels d'une clé
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyUpdate"
      responses:
        "200":
          description: Clé enregistrée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: revokeApiKey
      tags: [console]
      summary: Révoque une clé, immédiatement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Clé révoquée
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Clé inconnue
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/spaces:
    get:
      operationId: listSpaces
      tags: [console]
      summary: Espaces d'équipe, avec leurs modèles, leurs clés et leur consommation
      responses:
        "200":
          description: Les espaces, par nom
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Space"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSpace
      tags: [console]
      summary: Crée un espace (administrateurs)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceInput"
      responses:
        "201":
          description: Espace créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Space"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/spaces/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
    put:
      operationId: updateSpace
      tags: [console]
      summary: Change un espace (administrateurs)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceInput"
      responses:
        "200":
          description: Espace enregistré
          content:
            application/json:
              schema:
