        pdfSkipEmptyPages:
          type: boolean
        title:
          type: string
          maxLength: 500
        author:
          type: string
          maxLength: 500
        subject:
          type: string
          maxLength: 500
        keywords:
          type: string
          maxLength: 500
        devMode:
          type: boolean
    TryTemplate:
      type: object
      required: [name, size, prepareMs, analysis, sample]
      properties:
        name:
          type: string
        size:
          description: Taille du fichier, en octets
          type: integer
        prepareMs:
          description: Préparation par LibreOffice (Word vers ODT) ; 0 si déjà faite
          type: integer
        analysis:
          $ref: "#/components/schemas/TemplateAnalysis"
        sample:
          description: Données d'exemple, une valeur par balise
          type: object
          additionalProperties: true
        lint:
          type: array
          items:
            $ref: "#/components/schemas/LintIssue"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/TemplateField"
    TemplateAnalysis:
      type: object
      required: [fields, flowFields, checkboxes, sections, blockSections, repeats, images, shapes, tables, engine, reason]
      properties:
        fields:
          type: integer
        flowFields:
          description: Champs suivis de texte sur leur ligne
          type: integer
        checkboxes:
          type: integer
        sections:
          type: integer
        blockSections:
          description: Sections sur plusieurs paragraphes
          type: integer
        repeats:
          type: integer
        images:
          type: integer
        shapes:
          description: Formes et zones de texte positionnées
          type: integer
        tables:
          type: integer
        unsupported:
          description: Balises que DocIbis ne sait pas encore traiter
          type: array
          items:
            type: string
        engine:
          description: Moteur possible (overlay = calque, native = natif, standard = LibreOffice)
          type: string
          enum: [overlay, native, standard]
        reason:
          type: string
    TryResult:
      type: object
      required: [pdf, format, size, engine, prepareMs, mergeMs, renderMs, totalMs]
      properties:
        pdf:
          description: Le document, en base64 (un PDF, sauf autre format demandé)
          type: string
          contentEncoding: base64
        format:
          description: Format du document
          type: string
        size:
          description: Taille du document, en octets
          type: integer
        engine:
          description: Moteur utilisé, standard (LibreOffice), overlay (moteur rapide, calque posé sur un fond déjà rendu) ou native (copie Typst du modèle)
          type: string
          enum: [standard, overlay, native]
        prepareMs:
          description: Préparation par LibreOffice (Word vers ODT) ; 0 si déjà faite
          type: integer
        mergeMs:
          description: Fusion des données dans le modèle
          type: integer
        renderMs:
          description: Production du PDF par LibreOffice
          type: integer
        totalMs:
          type: integer
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready]
    Info:
      type: object
      required: [name, version, instance, database]
      properties:
        name:
          type: string
          examples: [DocIbis]
        version:
          type: string
          examples: [0.1.0]
        instance:
          description: Environnement affiché dans l'en-tête de la console (INT, REC, PPROD, PROD)
          type: string
        database:
          $ref: "#/components/schemas/DatabaseInfo"
    DatabaseInfo:
      type: object
      required: [engine, replication]
      properties:
        engine:
          type: string
          enum: [sqlite, postgres]
        replication:
          $ref: "#/components/schemas/Replication"
    Replication:
      description: Copie continue de la base SQLite (Litestream)
      type: object
      required: [enabled, locked]
      properties:
        enabled:
          type: boolean
        target:
          description: Destination de la copie, sans identifiants
          type: string
        locked:
          description: Un verrou sur S3 garantit une seule tâche qui écrit
          type: boolean
        leaseLost:
          description: Une autre tâche a pris la base ; celle-ci doit s'arrêter
          type: boolean
    Problem:
      description: Erreur au format RFC 9457
      type: object
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    MfaCode:
      type: object
      required: [code]
      properties:
        ticket:
          description: Reçu à l'étape précédente (connexion ou début d'activation)
          type: string
        code:
          description: Code à 6 chiffres de l'application d'authentification
          type: string
          maxLength: 10
    MfaStep:
      description: "code : saisir le code de l'application ; enroll : scanner le code QR puis saisir le premier code"
      type: object
      required: [step, ticket]
      properties:
        step:
          type: string
          enum: [code, enroll]
        ticket:
          type: string
        secret:
          description: Clé à saisir à la main si le code QR ne peut pas être scanné
          type: string
        otpauthUrl:
          type: string
        qrPng:
          description: Code QR (data URL PNG)
          type: string
    UserSession:
      type: object
      required: [id, current, expiresAt]
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        userAgent:
          type: string
        current:
          type: boolean
    AvatarChoice:
      type: object
      required: [icon, color]
      properties:
        icon:
          type: string
          maxLength: 40
        color:
          type: string
          maxLength: 20
    UserToken:
      type: object
      required: [id, name, prefix, createdAt, status]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        prefix:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, expired, revoked]
    UserTokenCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        expiresInDays:
          description: 0 ou absent pour la durée de vie des clés API
          type: integer
          minimum: 0
          maximum: 1825
    UserTokenCreated:
      type: object
      required: [token, secret]
      properties:
        token:
          $ref: "#/components/schemas/UserToken"
        secret:
          description: Montré une seule fois
          type: string
    McpCall:
      type: object
      required: [id, createdAt, actor, via, method, status, durationMs]
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        actor:
          type: string
        via:
          description: "token : jeton personnel ; key : clé API"
          type: string
        method:
          type: string
        tool:
          type: string
        status:
          type: string
          enum: [ok, error]
        error:
          type: string
        durationMs:
          type: integer
    McpCallPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/McpCall"
        total:
          type: integer
    AlertRuleConfig:
      type: object
      required: [enabled, threshold, forMinutes]
      properties:
        enabled:
          type: boolean
        threshold:
          type: number
        forMinutes:
          description: Durée pendant laquelle la condition doit durer avant l'alerte
          type: integer
          minimum: 0
          maximum: 1440
    AlertConfig:
      type: object
      required: [enabled, recipients, rules]
      properties:
        enabled:
          type: boolean
        recipients:
          description: Adresses e-mail
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 254
        teamsWebhook:
          description: Adresse du flux Teams (Workflows) ; masquée en lecture, la valeur masquée renvoyée telle quelle garde l'adresse enregistrée
          type: string
          maxLength: 2000
        rules:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AlertRuleConfig"
    AlertRule:
      type: object
      required: [id, unit, severity, min, max, defaults]
      properties:
        id:
          type: string
        unit:
          type: string
        severity:
          type: string
          enum: [warning, critical]
        min:
          type: number
        max:
          type: number
        defaults:
          $ref: "#/components/schemas/AlertRuleConfig"
    AlertState:
      type: object
      required: [rule, state, severity, unit, value, threshold]
      properties:
        rule:
          type: string
        state:
          type: string
          enum: [ok, pending, firing, disabled]
        severity:
          type: string
          enum: [warning, critical]
        unit:
          type: string
        value:
          type: number
        threshold:
          type: number
        since:
          type: string
          format: date-time
    AlertEvent:
      type: object
      required: [id, at, rule, state, severity, unit, value, threshold, notified]
      properties:
        id:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        rule:
          type: string
        state:
          type: string
          enum: [firing, resolved]
        severity:
          type: string
          enum: [warning, critical]
        unit:
          type: string
        value:
          type: number
        threshold:
          type: number
        notified:
          description: Canaux prévenus (email, teams), vide si aucun
          type: string
    AlertsInfo:
      type: object
      required: [config, rules, states, events, emailConfigured, teamsConfigured]
      properties:
        config:
          $ref: "#/components/schemas/AlertConfig"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/AlertRule"
        states:
          type: array
          items:
            $ref: "#/components/schemas/AlertState"
        events:
          type: array
          items:
            $ref: "#/components/schemas/AlertEvent"
        emailConfigured:
          description: Serveur SMTP réglé dans la configuration
          type: boolean
        teamsConfigured:
          type: boolean
    AlertTest:
      type: object
      required: [sent]
      properties:
        sent:
          description: Canaux qui ont accepté l'envoi
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: string
    LintIssue:
      type: object
      required: [level, code, message]
      properties:
        level:
          description: "error : le document sera faux ; warning : à vérifier ; info : bon à savoir"
          type: string
          enum: [error, warning, info]
        code:
          type: string
        message:
          type: string
    LintSummary:
      description: Vérifications de la dernière version
      type: object
      required: [errors, warnings, infos]
      properties:
        errors:
          type: integer
        warnings:
          type: integer
        infos:
          type: integer
    Scheduled:
      type: object
      required: [version, at]
      properties:
        version:
          type: integer
        at:
          type: string
          format: date-time
        by:
          type: string
    ScheduleRequest:
      type: object
      required: [version, at]
      properties:
        version:
          type: integer
          minimum: 1
        at:
          type: string
          format: date-time
    TemplateUse:
      type: object
      required: [id, count, errors, refused]
      properties:
        id:
          type: integer
          format: int64
        count:
          type: integer
        errors:
          type: integer
        refused:
          type: integer
        lastUsedAt:
          type: string
          format: date-time
    TemplateStats:
      type: object
      required: [days, count, errors, refused, p50Ms, p95Ms, series, callers, versions]
      properties:
        days:
          type: integer
        count:
          type: integer
        errors:
          type: integer
        refused:
          type: integer
        p50Ms:
          type: integer
        p95Ms:
          type: integer
        lastUsedAt:
          type: string
          format: date-time
        series:
          description: Un point par jour, le plus ancien d'abord
          type: array
          items:
            $ref: "#/components/schemas/TemplateDay"
        callers:
          description: Qui produit ce modèle, le plus actif d'abord
          type: array
          items:
            $ref: "#/components/schemas/TemplateCaller"
        versions:
          type: array
          items:
            $ref: "#/components/schemas/VersionUse"
        lastError:
          type: string
    CompareRequest:
      type: object
      required: [from, to]
      properties:
        from:
          type: integer
          minimum: 1
        to:
          type: integer
          minimum: 1
        data:
          description: Données des deux documents ; par défaut l'exemple de la plus récente
          type: object
          additionalProperties: true
    TemplateComparison:
      type: object
      required: [from, to, identical, pages, text]
      properties:
        from:
          type: integer
        to:
          type: integer
        identical:
          type: boolean
        pages:
          type: array
          items:
            $ref: "#/components/schemas/ComparedPage"
        text:
          description: Lignes de texte retirées ou ajoutées, avec un peu de contexte
          type: array
          items:
            $ref: "#/components/schemas/TextChange"
    Environment:
      type: object
      required: [name, url]
      properties:
        name:
          description: REC, PPROD, PROD…
          type: string
          maxLength: 20
        url:
          description: Adresse de l'autre DocIbis
          type: string
          maxLength: 300
        key:
          description: Clé API de l'autre DocIbis autorisée à recevoir des modèles ; masquée en lecture
          type: string
          maxLength: 200
    PromoteRequest:
      type: object
      required: [environment, version]
      properties:
        environment:
          type: string
        version:
          type: integer
          minimum: 1
        publish:
          description: Publier la version à l'arrivée
          type: boolean
    Promotion:
      type: object
      required: [id, createdAt, version, environment, status, detail, actor]
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
        environment:
          type: string
        status:
          type: string
          enum: [ok, error]
        detail:
          type: string
        actor:
          type: string
    BundleItem:
      type: object
      required: [template]
      properties:
        template:
          description: Chemin d'un modèle ou d'un PDF fixe de la bibliothèque
          type: string
          maxLength: 300
        condition:
          description: Condition sur les données (comme cs_), par exemple options.assistance = true ; vide = toujours
          type: string
          maxLength: 500
        dataPath:
          description: Partie des données donnée au modèle (par exemple contrat) ; vide = toutes
          type: string
          maxLength: 200
    BundleInput:
      type: object
      required: [name, items]
      properties:
        name:
          description: Nom appelé par les applications (lettres, chiffres, - _ .)
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        output:
          description: "pdf : un seul PDF ; zip : un fichier par document"
          type: string
          enum: [pdf, zip]
        items:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: "#/components/schemas/BundleItem"
    Bundle:
      type: object
      required: [id, name, description, output, items, createdAt, createdBy, updatedAt, updatedBy]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        output:
          type: string
          enum: [pdf, zip]
        items:
          type: array
          items:
            $ref: "#/components/schemas/BundleItem"
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
    BundleRenderRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: true
        outputName:
          type: string
          maxLength: 200
    SystemUsage:
      description: Processeur et mémoire de la tâche de l'API (LibreOffice compris)
      type: object
      required: [cpuPct, memMb, series]
      properties:
        cpuPct:
          description: Part du processeur alloué utilisée (dernière minute)
          type: number
        memMb:
          type: number
        memLimitMb:
          type: number
        cpuLimit:
          description: Processeurs alloués
          type: number
        source:
          type: string
        series:
          description: Une mesure par minute, la plus ancienne d'abord (24 h au plus)
          type: array
          items:
            $ref: "#/components/schemas/SystemPoint"
    SystemPoint:
      type: object
      required: [t, cpuAvg, cpuMax, memMb]
      properties:
        t:
          type: string
          format: date-time
        cpuAvg:
          type: number
        cpuMax:
          type: number
        memMb:
          type: number
    TemplateDay:
      type: object
      required: [day, count, errors]
      properties:
        day:
          type: string
          format: date
        count:
          type: integer
        errors:
          type: integer
    TemplateCaller:
      type: object
      required: [source, actor, count]
      properties:
        source:
          type: string
        actor:
          type: string
        count:
          type: integer
    VersionUse:
      type: object
      required: [version, count]
      properties:
        version:
          type: integer
        count:
          type: integer
    ComparedPage:
      type: object
      required: [number, permille]
      properties:
        number:
          type: integer
        permille:
          description: Part des pixels différents, pour mille ; -1 si la page n'existe que d'un côté
          type: number
        before:
          description: Page de la version from (PNG en data URL)
          type: string
        after:
          description: Page de la version to, différences surlignées (PNG en data URL)
          type: string
    TextChange:
      type: object
      required: [op, line]
      properties:
        op:
          type: string
          enum: [same, removed, added]
        line:
          type: string
