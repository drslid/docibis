        accessKey:
          description: Clé API DocIbis (dib_…) ; sinon en-tête Authorization
          type: string
        templateName:
          type: string
        outputName:
          description: Nom du document ; son extension donne le format (pdf, docx, doc, odt, rtf, html, txt, xlsx, ods, pptx, odp)
          type: string
        outputFormat:
          type: string
        data:
          description: Données du document, objet JSON ou texte JSON
    DocmosisRenderForm:
      type: object
      required: [templateName, outputName]
      properties:
        accessKey:
          type: string
        templateName:
          type: string
        outputName:
          type: string
        outputFormat:
          type: string
        data:
          description: Texte JSON
          type: string
    DocmosisError:
      type: object
      required: [succeeded, shortMsg]
      properties:
        succeeded:
          type: boolean
        shortMsg:
          type: string
        longMsg:
          type: string
    LibraryTemplate:
      type: object
      required: [id, path, kind, description, published, versions, dataCheck, createdAt, createdBy, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        path:
          type: string
        kind:
          description: template = modèle Word ; pdf = document fixe à joindre
          type: string
          enum: [template, pdf, typst]
        description:
          type: string
        published:
          description: Version servie aux applications (0 = aucune)
          type: integer
        versions:
          type: integer
        dataCheck:
          type: string
          enum: [off, warn, strict]
        engine:
          type: string
        hasReference:
          type: boolean
        check:
          $ref: "#/components/schemas/CheckResult"
        lint:
          $ref: "#/components/schemas/LintSummary"
        previousPublished:
          description: Version publiée avant celle-ci (retour arrière), 0 si aucune
          type: integer
        scheduled:
          $ref: "#/components/schemas/Scheduled"
        fast:
          $ref: "#/components/schemas/FastStatus"
        native:
          $ref: "#/components/schemas/NativeStatus"
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedAt:
          type: string
          format: date-time
    FastStatus:
      description: >-
        Moteur rapide d'une version : DocIbis rend une fois le fond du modèle puis pose les valeurs
        par-dessus, après avoir vérifié au pixel près que le résultat est celui de LibreOffice.
      type: object
      required: [state, at]
      properties:
        state:
          description: >-
            qualified (le calque sert les PDF), refused (écart ou cas non couvert : LibreOffice sert),
            standard (modèle hors de portée du calque), error (la qualification a échoué)
          type: string
          enum: [qualified, refused, standard, error]
        reason:
          description: Pourquoi le calque n'est pas utilisé
          type: string
        permille:
          description: Plus grand écart de pixels mesuré avec LibreOffice, en pour mille
          type: number
        tests:
          description: Nombre de jeux de données comparés
          type: integer
        overlayMs:
          description: Durée d'un rendu par le calque, en millisecondes
          type: number
        standardMs:
          description: Durée du même rendu par LibreOffice, en millisecondes
          type: integer
        at:
          type: string
          format: date-time
    NativeStatus:
      description: >-
        Moteur natif d'une version : une copie Typst du modèle, écrite à la main pour cette version,
        produit le PDF sans LibreOffice tant qu'elle donne le même document au pixel près.
      type: object
      required: [state, sourceSha256]
      properties:
        state:
          description: >-
            pending (copie jointe, comparaison à faire), qualified (la copie sert les PDF),
            refused (écart avec LibreOffice : LibreOffice sert), error (la comparaison a échoué)
          type: string
          enum: [pending, qualified, refused, error]
        reason:
          description: Pourquoi la copie n'est pas utilisée
          type: string
        permille:
          description: Plus grand écart de pixels mesuré avec LibreOffice, en pour mille
          type: number
        tests:
          description: Nombre de jeux de données comparés
          type: integer
        nativeMs:
          description: Durée d'un rendu par la copie Typst, en millisecondes
          type: number
        standardMs:
          description: Durée du même rendu par LibreOffice, en millisecondes
          type: integer
        at:
          description: Date de la dernière comparaison
          type: string
          format: date-time
        sourceSha256:
          description: Empreinte de la copie Typst
          type: string
        sourceBytes:
          description: Taille de la copie Typst, en octets
          type: integer
        by:
          description: Qui a joint la copie
          type: string
        attachedAt:
          description: Quand la copie a été jointe
          type: string
          format: date-time
    NativeUpload:
      type: object
      required: [source]
      properties:
        source:
          description: Copie Typst du modèle (.typ), qui lit sys.inputs.data (les données JSON), sys.inputs.today (AAAA-MM-JJ, UTC) et sys.inputs.now
          type: string
          format: binary
    LibraryVersion:
      type: object
      required: [number, size, sha256, engine, note, createdAt, createdBy, hasReference]
      properties:
        number:
          type: integer
        size:
          type: integer
          format: int64
        sha256:
          type: string
        engine:
          type: string
        note:
          type: string
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        hasReference:
          type: boolean
        check:
          $ref: "#/components/schemas/CheckResult"
        lint:
          description: Vérifications du modèle ; absent tant qu'elles ne sont pas faites
          type: array
          items:
            $ref: "#/components/schemas/LintIssue"
        fast:
          $ref: "#/components/schemas/FastStatus"
        native:
          $ref: "#/components/schemas/NativeStatus"
    TemplateField:
