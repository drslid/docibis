{{- if not .Values.existingSecret }}
{{- if lt (len .Values.appSecretKey) 32 }}
{{- fail "appSecretKey needs 32 characters at least (or set existingSecret)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "docibis.fullname" . }}
  labels:
    {{- include "docibis.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_SECRET_KEY: {{ .Values.appSecretKey | quote }}
  {{- with .Values.webhookSecret }}
  WEBHOOK_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.metricsToken }}
  METRICS_TOKEN: {{ . | quote }}
  {{- end }}
  {{- with .Values.databaseUrl }}
  DATABASE_URL: {{ . | quote }}
  {{- end }}
{{- end }}
