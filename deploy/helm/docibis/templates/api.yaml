{{- if and (gt (int .Values.api.replicas) 1) (not .Values.databaseUrl) (not .Values.existingSecret) }}
{{- fail "api.replicas > 1 needs PostgreSQL (databaseUrl): SQLite has a single writer" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "docibis.fullname" . }}-api
  labels:
    {{- include "docibis.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  # SQLite has a single writer: the old pod stops before the new one starts.
  strategy:
    type: {{ if .Values.databaseUrl }}RollingUpdate{{ else }}Recreate{{ end }}
  selector:
    matchLabels:
      {{- include "docibis.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "docibis.selector" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: {{ include "docibis.image" (dict "root" . "app" "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "docibis.containerSecurity" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: INSTANCE_NAME
              value: {{ .Values.instanceName | quote }}
            {{- with .Values.stateUrl }}
            - name: STATE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "docibis.secret" . }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- if .Values.fonts.existingClaim }}
            - name: fonts
              mountPath: /usr/local/share/fonts/docibis
              readOnly: true
            {{- end }}
          # LibreOffice takes a few seconds to warm up.
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "docibis.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.fonts.existingClaim }}
        - name: fonts
          persistentVolumeClaim:
            claimName: {{ . }}
            readOnly: true
        {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "docibis.fullname" . }}-api
  labels:
    {{- include "docibis.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "docibis.selector" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
