name: Release

# Images on GHCR: :edge from main, :vX.Y.Z and :latest from a version tag.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 200
      - name: Version and notes of the "What's new" page
        if: matrix.app == 'api'
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then echo "$GITHUB_REF_NAME"; else echo "edge-${GITHUB_SHA::7}"; fi > apps/api/VERSION
          git log -150 --no-merges --format='%H%x09%cI%x09%s' > apps/api/CHANGES
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/docibis-${{ matrix.app }}
          tags: |
            type=edge,branch=main
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      # Known vulnerabilities of the image: those with a published fix stop
      # the release before the push; the others are listed in the log. The
      # runtime stage, which installs the system packages, never comes from
      # the cache: it would keep versions without the latest security fixes.
      - name: Build for the scan
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          platforms: linux/amd64
          load: true
          tags: docibis-${{ matrix.app }}:scan
          cache-from: type=gha,scope=${{ matrix.app }}
          no-cache-filters: runtime
      - name: Trivy
        run: |
          trivy() { docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache/trivy ghcr.io/aquasecurity/trivy:0.76.1 "$@"; }
          trivy image --timeout 30m --scanners vuln --severity HIGH,CRITICAL "docibis-${{ matrix.app }}:scan"
          trivy image --timeout 30m --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --skip-db-update "docibis-${{ matrix.app }}:scan"
      # amd64 and arm64 (AWS Graviton, Ampere…): the arm64 steps that run
      # commands are emulated.
      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          no-cache-filters: runtime

  # A version tag, once its images are pushed, becomes a GitHub release: the
  # tag message as notes, and install.sh set to this version, so that
  # releases/latest/download/install.sh installs the latest release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          sed "s/^REF=\${DOCIBIS_REF:-main}\$/REF=\${DOCIBIS_REF:-$GITHUB_REF_NAME}/" install.sh > dist/install.sh
          grep -q "^REF=\${DOCIBIS_REF:-$GITHUB_REF_NAME}\$" dist/install.sh
          gh release create "$GITHUB_REF_NAME" dist/install.sh --verify-tag --notes-from-tag --title "DocIbis $GITHUB_REF_NAME"
