name: Release

# Images on GHCR: :edge from main, :vX.Y.Z and :latest from a version tag.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 200
      - name: Version and notes of the "What's new" page
        if: matrix.app == 'api'
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then echo "$GITHUB_REF_NAME"; else echo "edge-${GITHUB_SHA::7}"; fi > apps/api/VERSION
          git log -150 --no-merges --format='%H%x09%cI%x09%s' > apps/api/CHANGES
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/docibis-${{ matrix.app }}
          tags: |
            type=edge,branch=main
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
