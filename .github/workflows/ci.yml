name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # The latest patch release, like the golang:1.27 image of the Dockerfile.
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: apps/api/go.sum
      - name: Generated code matches the contract
        run: |
          go generate ./internal/httpapi
          git diff --exit-code -- internal/httpapi/api.gen.go
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Generated client matches the contract
        run: |
          npm run generate
          git diff --exit-code -- src/api/generated
      - run: npm run lint
      - run: npm test
      - run: npm run build

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck install.sh
      - run: docker compose config --quiet
        env:
          APP_SECRET_KEY: ci-only-key-with-at-least-32-characters
      - name: Helm chart
        run: docker run --rm -v "$PWD/deploy/helm/docibis:/chart:ro" alpine/helm:3.19.0 lint /chart --set appSecretKey=ci-only-key-with-at-least-32-characters

  n8n:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/n8n-nodes-docibis
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --ignore-scripts --audit=false --fund=false
      - run: npm run build
